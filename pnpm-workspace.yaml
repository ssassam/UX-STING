packages:
  - "apps/*"
  - "packages/*"
  - "examples/*"

# pnpm 10 blocks dependency install scripts by default (supply-chain safety).
# These two only fetch optional native helpers that nothing here needs, so they
# are skipped explicitly instead of showing a warning on every install.
ignoredBuiltDependencies:
  - "@parcel/watcher"
  - esbuild

# Security: force patched releases of transitive dependencies.
overrides:
  # GHSA-68fv-2mgg-jv7q (jsdom → css-tree → source-map-js, tests only).
  source-map-js: ">=1.2.2"
  # Zod memory exhaustion on oversized input (eslint-plugin-react-hooks → zod, lint only).
  zod: ">=4.6.6"
  # undici DoS via unhandled content-encodings (jsdom → undici, tests only).
  undici: ">=8.12.2"

auditConfig:
  ignoreGhsas:
    # braces ≤ 3.0.3, GHSA-vfj7-8cjw-p6xm: no patched release exists yet.
    # Reached only through @tailwindcss/cli → @parcel/watcher → micromatch at
    # build time (never shipped to browsers; @parcel/watcher's install script
    # is already skipped above). Remove this entry once a fixed braces ships.
    - GHSA-vfj7-8cjw-p6xm
