name: CI

on:
  push:
    branches: [main, claude/wonderful-cori-26r2b1]
  pull_request:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm ux-audit
      - run: pnpm audit --audit-level high
      - run: pnpm size

  apps:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:all
      - name: Browser accessibility audit (axe incl. contrast, overflow)
        run: |
          npx playwright install --with-deps chromium
          (cd apps/docs && npx next start -p 3100 &) && sleep 5
          node scripts/browser-audit.ts http://localhost:3100 / /components /components/button /components/data-table /components/form /docs/accessibility
          (cd examples/travel && npx next start -p 3200 &) && sleep 5
          node scripts/browser-audit.ts http://localhost:3200 / /destinations /destinations/santorini /search /stays/riad-yasmine /tours/atlas-and-sahara "/checkout?stay=riad-yasmine" /trips
        env:
          AUDIT_QUICK: "1"
          NO_SHOTS: "1"

  visual:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx playwright install --with-deps chromium
      - run: pnpm --filter @ux-sting/storybook build
      # Reference screenshots are platform-specific, so they are generated here
      # (Linux Chromium) the first time and uploaded as the `visual-baselines`
      # artifact; commit them to apps/storybook/visual/__screenshots__ to make
      # this a real regression check.
      - name: Visual regression
        run: |
          if [ ! -d apps/storybook/visual/__screenshots__ ]; then
            pnpm --filter @ux-sting/storybook test:visual:update
          fi
          pnpm --filter @ux-sting/storybook test:visual
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-baselines
          path: apps/storybook/visual/__screenshots__
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-diffs
          path: apps/storybook/test-results
