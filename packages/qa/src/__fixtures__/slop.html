<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slop fixture</title>
    <style>
      body {
        margin: 0;
        font:
          16px/1.5 system-ui,
          sans-serif;
        color: #111;
      }
      .hero {
        text-align: center;
        padding: 64px 16px;
        background: linear-gradient(135deg, #6d28d9, #4f46e5);
        color: #fff;
      }
      .hero h1 {
        margin: 0;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        max-width: 960px;
        margin: 32px auto;
        padding: 0 16px;
      }
      .card {
        padding: 16px;
        border: 1px solid #ddd;
      }
      table {
        margin: 16px;
        border-collapse: collapse;
      }
      td {
        padding: 4px 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <h1>Unlock the power of seamless analytics</h1>
        <p>Trusted by 10,000+ teams. 99.99% uptime.</p>
      </section>
      <section class="cards">
        <div class="card">
          <h3>🚀 Fast</h3>
          <p>Lorem ipsum dolor sit amet, consectetur.</p>
        </div>
        <div class="card">
          <h3>🔒 Secure</h3>
          <p>Built with cutting-edge encryption today.</p>
        </div>
        <div class="card">
          <h3>⚡ Simple</h3>
          <p>Supercharge your workflow in minutes.</p>
        </div>
      </section>
      <table>
        <tr>
          <th scope="col">Plan</th>
          <th scope="col">Seats</th>
          <th scope="col">Price</th>
        </tr>
        <tr>
          <td>Team</td>
          <td>12</td>
          <td>1,240.50</td>
        </tr>
        <tr>
          <td>Scale</td>
          <td>140</td>
          <td>9,999.00</td>
        </tr>
      </table>
    </main>
  </body>
</html>
