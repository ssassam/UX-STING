<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>List reorder — UX-STING motion</title>
    <link rel="stylesheet" href="demo.css" />
    <link rel="stylesheet" href="../css/list-reorder.css" />
  </head>
  <body>
    <main>
      <nav class="back" aria-label="Breadcrumb"><a href="index.html">Motion catalog</a></nav>
      <h1>List reorder</h1>
      <p>
        Sort or shuffle: items glide to their new places with the View Transitions API, or FLIP
        where it is missing.
      </p>
      <div class="bar" data-demo-bar></div>
      <div class="bar">
        <button type="button" class="primary" data-sort="name">Sort by name</button
        ><button type="button" data-sort="price">Sort by price</button
        ><button type="button" data-sort="shuffle">Shuffle</button>
      </div>
      <ul class="us-reorder list stage" id="list" aria-live="polite"></ul>
    </main>
    <script type="module" src="demo.js"></script>
    <script type="module">
      import { reorder } from "../dist/index.js";
      const items = [
        ["Linen shirt", 89],
        ["Wool coat", 249],
        ["Canvas tote", 35],
        ["Leather belt", 59],
        ["Cotton scarf", 42],
      ];
      const list = document.getElementById("list");
      for (const [name, price] of items) {
        const li = document.createElement("li");
        li.className = "panel us-reorder-item";
        li.dataset.key = name;
        li.dataset.price = price;
        li.innerHTML = `<span>${name}</span><span>€${price}</span>`;
        list.append(li);
      }
      const by = {
        name: (a, b) => a.dataset.key.localeCompare(b.dataset.key),
        price: (a, b) => a.dataset.price - b.dataset.price,
        shuffle: () => Math.random() - 0.5,
      };
      document
        .querySelectorAll("[data-sort]")
        .forEach((b) =>
          b.addEventListener("click", () =>
            reorder(list, () => list.append(...[...list.children].sort(by[b.dataset.sort]))),
          ),
        );
    </script>
  </body>
</html>
